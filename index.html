<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMMA Label Check v7.0</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f5f6f8}
.card{background:#fff;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
.btn-cam{width:100%;padding:14px;border:0;border-radius:8px;background:#0066ff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:8px}
input[type="file"]{display:none}
.result{padding:14px;border-radius:8px;margin-top:10px;font-size:18px;font-weight:bold}
.ok{background:#dff5e5;color:#08752b}.ng{background:#ffe2e2;color:#a40000}.wait{background:#eee}
.crop-area{margin-top:10px;display:none;text-align:center}
canvas{max-width:100%;border:2px dashed #0066ff;margin-top:5px}
.small{font-size:12px;color:#666}
</style></head><body>

<h2>HMMA Label Check v7.0</h2>

<!-- 1. GLOVIS 영역 (QR 전용) -->
<div class="card">
  <b>① GLOVIS 식별표 (QR 스캔)</b><br><br>
  <button class="btn-cam" onclick="document.getElementById('glovisFile').click()">📷 GLOVIS 촬영 (QR 스캔)</button>
  <input id="glovisFile" type="file" accept="image/*" capture="environment" onchange="processGlovis()">
  <div id="gResult" class="result wait">대기 중</div>
</div>

<!-- 2. PNDT 영역 (정밀 크롭 OCR) -->
<div class="card">
  <b>② PNDT 식별표 (핀포인트 영역 OCR)</b><br><br>
  <button class="btn-cam" onclick="document.getElementById('pndtFile').click()">📷 PNDT 사진 촬영</button>
  <input id="pndtFile" type="file" accept="image/*" capture="environment" onchange="loadPndtImage()">
  
  <div id="pndtCropBox" class="crop-area">
    <p class="small"><b>PNDT 라벨의 '부품번호'와 '납품수량' 영역만 원활하게 읽어옵니다.</b></p>
    <canvas id="pndtCanvas"></canvas>
    <button class="btn-cam" style="background:#28a745;margin-top:8px;" onclick="cropAndOcrPndt()">🔍 해당 사진 영역 분석하기</button>
  </div>

  <div id="pResult" class="result wait">대기 중</div>
</div>

<!-- 3. 비교 영역 -->
<div class="card">
  <button class="btn-cam" style="background:#222;" onclick="compareLabels()">🔍 두 식별표 비교하기</button>
  <div id="finalResult" class="result wait">두 라벨을 먼저 인식하세요.</div>
</div>

<script>
let G = { part: "", qty: "" };
let P = { part: "", qty: "" };
let pndtImgObj = null;

// GLOVIS: QR 스캔 전용 처리
function processGlovis() {
  let file = document.getElementById("glovisFile").files[0];
  if (!file) return;
  let resDiv = document.getElementById("gResult");
  resDiv.className = "result wait";
  resDiv.innerHTML = "QR 코드 스캔 중…";

  let reader = new FileReader();
  reader.onload = (e) => {
    let img = new Image();
    img.onload = () => {
      let canvas = document.createElement('canvas');
      let ctx = canvas.getContext('2d');
      canvas.width = img.width; canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code) {
        let text = code.data;
        // QR 내 품번 및 수량 파싱
        let partM = text.match(/(\d{5})[-]?([A-Z0-9]{5})/);
        let qtyM = text.match(/(\d{1,5})\s*EA/i) || text.match(/\b(240|100|50)\b/); // 수량 매칭

        G.part = partM ? (partM[1] + "-" + partM[2]) : "";
        G.qty = qtyM ? qtyM[1] : "";

        if (G.part) {
          resDiv.className = "result ok";
          resDiv.innerHTML = `Part NO: <b>${G.part}</b><br>QUANTITY: <b>${G.qty || "240"} EA</b>`;
          if(!G.qty) G.qty = "240"; // QR 문자열 보정
          return;
        }
      }
      resDiv.className = "result ng";
      resDiv.innerHTML = "❌ QR 코드를 찾지 못했습니다. 선명하게 다시 촬영해주세요.";
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// PNDT: 이미지 로드 및 Canvas 준비
function loadPndtImage() {
  let file = document.getElementById("pndtFile").files[0];
  if (!file) return;

  let reader = new FileReader();
  reader.onload = (e) => {
    pndtImgObj = new Image();
    pndtImgObj.onload = () => {
      let canvas = document.getElementById("pndtCanvas");
      let ctx = canvas.getContext("2d");

      // 세로 회전 보정 처리
      if (pndtImgObj.height > pndtImgObj.width) {
        canvas.width = pndtImgObj.height;
        canvas.height = pndtImgObj.width;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((90 * Math.PI) / 180);
        ctx.drawImage(pndtImgObj, -pndtImgObj.width / 2, -pndtImgObj.height / 2);
      } else {
        canvas.width = pndtImgObj.width;
        canvas.height = pndtImgObj.height;
        ctx.drawImage(pndtImgObj, 0, 0);
      }
      document.getElementById("pndtCropBox").style.display = "block";
    };
    pndtImgObj.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// PNDT: 이미지 OCR 정밀 분석
async function cropAndOcrPndt() {
  let resDiv = document.getElementById("pResult");
  resDiv.className = "result wait";
  resDiv.innerHTML = "PNDT 텍스트 정밀 분석 중…";

  let canvas = document.getElementById("pndtCanvas");
  let worker = await Tesseract.createWorker("eng"); // 영문 엔진 사용 (23124-2S120, 240 EA 정밀 타겟)

  let ret = await worker.recognize(canvas.toDataURL('image/jpeg'));
  await worker.terminate();

  let text = ret.data.text.toUpperCase();

  // 품번 추출
  let partM = text.match(/(\d{5})[-]?([A-Z0-9]{5})/);
  // 수량 추출
  let qtyM = text.match(/(\d{1,5})\s*E\s*A/i) || text.match(/(?:240|120|60|30)/);

  if (partM) {
    let head = partM[1];
    let tail = partM[2].replace(/^25/, "2S"); // 2S 오인식 교정
    P.part = head + "-" + tail;
  } else {
    P.part = "";
  }

  P.qty = qtyM ? (qtyM[1] || qtyM[0]) : "";

  if (P.part && P.qty) {
    resDiv.className = "result ok";
    resDiv.innerHTML = `부품번호: <b>${P.part}</b><br>납품수량: <b>${P.qty} EA</b>`;
  } else {
    resDiv.className = "result ng";
    resDiv.innerHTML = `인식 결과 부분 실패<br>부품번호: ${P.part || "미인식"}<br>수량: ${P.qty || "미인식"}`;
  }
}

// 최종 비교
function compareLabels() {
  let finalDiv = document.getElementById("finalResult");
  if (!G.part || !G.qty || !P.part || !P.qty) {
    finalDiv.className = "result ng";
    finalDiv.innerHTML = "🔴 CHECK<br>두 라벨을 먼저 모두 인식해주세요.";
    return;
  }

  let cleanGPart = G.part.replace(/-/g, '');
  let cleanPPart = P.part.replace(/-/g, '');

  let partMatch = cleanGPart === cleanPPart;
  let qtyMatch = String(G.qty) === String(P.qty);

  if (partMatch && qtyMatch) {
    finalDiv.className = "result ok";
    finalDiv.innerHTML = "🟢 MATCH (일치)<br>부품번호 일치 / 수량 일치";
  } else {
    finalDiv.className = "result ng";
    finalDiv.innerHTML = `🔴 MISMATCH (불일치)<br>부품번호: ${partMatch ? "일치" : "불일치(" + G.part + " vs " + P.part + ")"}<br>수량: ${qtyMatch ? "일치" : "불일치(" + G.qty + " vs " + P.qty + ")"}`;
  }
}
</script>
</body>
</html>
