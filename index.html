<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMMA Label Check v3.4</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f5f6f8}
.card{background:#fff;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
button{padding:12px 16px;border:0;border-radius:8px;background:#222;color:#fff;font-size:16px;margin:4px;cursor:pointer}
.btn-cam{background:#0056b3;font-weight:bold}
input[type="file"]{display:none}
.result{padding:14px;border-radius:8px;margin-top:10px;font-size:18px;font-weight:bold}
.ok{background:#dff5e5;color:#08752b}.ng{background:#ffe2e2;color:#a40000}.wait{background:#eee}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:150px;overflow-y:auto;background:#fafafa;padding:8px;border:1px solid #ddd}
.small{font-size:12px;color:#666}
</style></head><body>
<h1>HMMA Label Check v3.4</h1>

<div class="card"><b>① GLOVIS 식별표</b><br>
<button class="btn-cam" onclick="document.getElementById('glovisFile').click()">📷 GLOVIS 사진 촬영</button>
<input id="glovisFile" type="file" accept="image/*" capture="environment" onchange="readGlovis()">
<div id="gResult" class="result wait">대기 중</div><pre id="gRaw"></pre></div>

<div class="card"><b>② PNDT 식별표</b><br>
<button class="btn-cam" onclick="document.getElementById('pndtFile').click()">📷 PNDT 사진 촬영</button>
<input id="pndtFile" type="file" accept="image/*" capture="environment" onchange="readPndt()">
<div id="pResult" class="result wait">대기 중</div><pre id="pRaw"></pre></div>

<div class="card"><b>③ 최종 비교</b>
<button onclick="compareLabels()">두 라벨 비교</button>
<div id="finalResult" class="result wait">두 라벨을 먼저 인식하세요.</div></div>

<div class="card small">버튼을 누르면 바로 스마트폰 카메라 촬영 모드로 연결됩니다.</div>

<script>
let G={part:"",qty:""},P={part:"",qty:""};

// 세로 이미지 자동 90도 회전
function preprocessImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (img.height > img.width) {
        canvas.width = img.height;
        canvas.height = img.width;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((90 * Math.PI) / 180);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
      } else {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      }
      resolve(canvas.toDataURL('image/jpeg'));
    };
    img.src = URL.createObjectURL(file);
  });
}

function norm(s){ return (s||"").toUpperCase().replace(/[–—−_]/g,"-"); }

// 현대/기아 부품번호 추출 (예: 23124-2S120)
function extractPartNumber(text) {
  let cleaned = norm(text);
  
  // 1. 하이픈이 포함된 패턴 (예: 23124-2S120)
  let m1 = cleaned.match(/\b\d{5}\s*-\s*[A-Z0-9]{5}\b/g);
  if (m1) {
    let raw = m1[0].replace(/\s+/g, '');
    let parts = raw.split('-');
    let head = parts[0].replace(/O/g, '0');
    let tail = parts[1].replace(/O/g, '0');
    if (/^2[5]\d{3}$/.test(tail)) tail = "2S" + tail.slice(2);
    return head + "-" + tail;
  }

  // 2. 하이픈 없이 붙어있는 10자리 패턴
  let m2 = cleaned.match(/\b\d{5}[A-Z0-9]{5}\b/g);
  if (m2) {
    let raw = m2[0];
    let head = raw.slice(0, 5).replace(/O/g, '0');
    let tail = raw.slice(5, 10).replace(/O/g, '0');
    if (/^2[5]\d{3}$/.test(tail)) tail = "2S" + tail.slice(2);
    return head + "-" + tail;
  }

  return "";
}

// 수량 추출 (PNDT 및 GLOVIS 공통 대응)
function extractQty(text) {
  let cleanText = norm(text);

  // 1. '240 EA' 단독 표기 패턴 최우선
  let m1 = cleanText.match(/(\d{1,5})\s*E\s*A/i);
  if (m1) return m1[1];

  // 2. GLOVIS 'Quantity 240' 라인 패턴
  let m2 = cleanText.match(/(?:QUANTITY|QTY|Q'TY)[\s:：]*(\d{1,5})/i);
  if (m2) return m2[1];

  // 3. PNDT '납품수량 240' 라인 패턴
  let m3 = cleanText.match(/(?:납품\s*수량|수량)[\s:：]*(\d{1,5})/i);
  if (m3) return m3[1];

  return "";
}

async function ocr(file, lang){
  const processedImg = await preprocessImage(file);
  // 화이트리스트 제거하여 OCR 정상 동작 보장
  const r = await Tesseract.recognize(processedImg, lang, {
    logger: x => console.log(x)
  });
  return r.data.text;
}

function box(id, msg, c){
  let e = document.getElementById(id);
  e.className = "result " + c;
  e.innerHTML = msg;
}

async function readGlovis(){
  let f = document.getElementById("glovisFile").files[0];
  if(!f) return;
  box("gResult", "GLOVIS 식별표 분석 중…", "wait");
  try {
    let raw = await ocr(f, "eng");
    G = { part: extractPartNumber(raw), qty: extractQty(raw) };
    document.getElementById("gRaw").textContent = raw;
    box("gResult", "품번: <b>" + (G.part || "인식 실패") + "</b><br>수량: <b>" + (G.qty ? G.qty + " EA" : "인식 실패") + "</b>", G.part && G.qty ? "ok" : "ng");
  } catch(e) {
    box("gResult", "GLOVIS 인식 오류", "ng");
  }
}

async function readPndt(){
  let f = document.getElementById("pndtFile").files[0];
  if(!f) return;
  box("pResult", "PNDT 식별표 분석 중…", "wait");
  try {
    let raw = await ocr(f, "kor+eng");
    P = { part: extractPartNumber(raw), qty: extractQty(raw) };
    document.getElementById("pRaw").textContent = raw;
    box("pResult", "품번: <b>" + (P.part || "인식 실패") + "</b><br>납품수량: <b>" + (P.qty ? P.qty + " EA" : "인식 실패") + "</b>", P.part && P.qty ? "ok" : "ng");
  } catch(e) {
    box("pResult", "PNDT 인식 오류", "ng");
  }
}

function compareLabels(){
  if(!G.part || !G.qty || !P.part || !P.qty){
    box("finalResult", "🔴 CHECK<br>두 라벨의 품번과 수량을 먼저 모두 인식해야 합니다.", "ng");
    return;
  }
  let a = G.part === P.part;
  let b = String(G.qty) === String(P.qty);
  box("finalResult", a && b ? "🟢 LABEL MATCH<br>품번 일치 / 수량 일치" : "🔴 LABEL MISMATCH<br>품번: " + (a ? "일치" : "불일치") + "<br>수량: " + (b ? "일치" : "불일치"), a && b ? "ok" : "ng");
}
</script></body></html>
