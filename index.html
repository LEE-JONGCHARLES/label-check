<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>GLOVIS 식별표 자동 검사</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 14px;
}

h1 {
    margin: 0 0 6px;
    font-size: 27px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 14px;
}

.card {
    background: #1d1d1d;
    border-radius: 15px;
    padding: 14px;
    margin-bottom: 14px;
}


/* =========================
   버튼
========================= */

button,
.file-label {
    display: inline-block;

    border: 0;
    border-radius: 12px;

    padding: 14px 18px;

    margin: 4px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button {
    background: #00d084;
    color: #000;
}

button.secondary,
.file-label {
    background: #333;
    color: white;
}

button:disabled {
    opacity: .4;
}


/* =========================
   카메라 영역
========================= */

.camera {

    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #000;

    border-radius: 13px;

    overflow: hidden;
}


.camera video,
.camera img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}


/* =========================
   전체 녹색 가이드
========================= */

.outer-guide {

    position: absolute;

    left: 5%;
    right: 5%;

    top: 28%;
    height: 55%;

    border: 3px solid #00e889;

    border-radius: 10px;

    box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.20);

    pointer-events: none;
}


/* ==================================================
   ★ Part No. 가이드

   실제 사진에서

   23124-2S120

   숫자가 있는 위치에 맞춤
================================================== */

.part-guide {

    position: absolute;

    left: 24%;

    top: 49%;

    width: 34%;

    height: 7.5%;

    border: 4px solid #ffe600;

    border-radius: 7px;

    background:
        rgba(255,230,0,.07);

    box-shadow:
        0 0 10px
        rgba(255,230,0,.65);

    pointer-events: none;
}


/* ==================================================
   ★ Quantity 가이드

   실제 사진에서

   240

   위치에 맞춤
================================================== */

.qty-guide {

    position: absolute;

    left: 81%;

    top: 49%;

    width: 10%;

    height: 7.5%;

    border: 4px solid #ffe600;

    border-radius: 7px;

    background:
        rgba(255,230,0,.07);

    box-shadow:
        0 0 10px
        rgba(255,230,0,.65);

    pointer-events: none;
}


/* =========================
   가이드 글자
========================= */

.guide-label {

    position: absolute;

    color: #ffe600;

    font-weight: bold;

    font-size: 14px;

    text-shadow:
        0 1px 4px #000;

    pointer-events: none;
}


.part-label {

    left: 24%;

    top: 44%;
}


.qty-label {

    left: 81%;

    top: 44%;
}


/* =========================
   진행률
========================= */

.progress {

    width: 100%;

    height: 7px;

    background: #333;

    border-radius: 10px;

    overflow: hidden;
}


.progress-bar {

    width: 0%;

    height: 100%;

    background: #00d084;
}


/* =========================
   결과
========================= */

.result {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}


.result-box {

    background: #292929;

    padding: 15px;

    border-radius: 12px;
}


.result-title {

    color: #aaa;

    font-size: 15px;
}


.result-value {

    margin-top: 5px;

    font-size: 26px;

    font-weight: bold;
}


.ok {

    color: #00e889;
}


.fail {

    color: #ff6666;
}


/* =========================
   OCR 영역
========================= */

.preview-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}


.preview-grid img {

    width: 100%;

    background: #000;

    border-radius: 10px;

    margin-top: 6px;
}


/* =========================
   OCR 원문
========================= */

pre {

    background: #090909;

    padding: 12px;

    border-radius: 10px;

    white-space: pre-wrap;

    color: #bbb;
}


/* =========================
   모바일
========================= */

@media(max-width:650px) {

    .container {

        padding: 9px;
    }


    .result {

        grid-template-columns:
            1fr;
    }


    .preview-grid {

        grid-template-columns:
            1fr;
    }


    button,
    .file-label {

        width: 100%;

        margin: 4px 0;
    }


    .result-value {

        font-size: 23px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>GLOVIS 식별표 자동 검사</h1>


<div class="subtitle">

식별표를 노란 박스에 맞추고 촬영하세요.

</div>


<!-- =========================
     버튼
========================= -->

<div class="card">


<label class="file-label">

📷 사진 첨부

<input
    id="fileInput"
    type="file"
    accept="image/*"
    style="display:none">

</label>


<button
    id="cameraBtn"
    class="secondary">

📱 카메라 시작

</button>


<button
    id="captureBtn"
    disabled>

촬영

</button>


</div>


<!-- =========================
     카메라
========================= -->

<div class="card">


<div class="camera">


<video
    id="video"
    autoplay
    playsinline
    muted
    style="display:none">
</video>


<img
    id="photo"
    style="display:none">


<div class="outer-guide"></div>


<div class="guide-label part-label">

① Part No.

</div>


<div class="guide-label qty-label">

② Quantity

</div>


<div class="part-guide"></div>


<div class="qty-guide"></div>


</div>


<div class="note">

노란 박스 안에

<b>Part No.</b>와

<b>Quantity</b>가 들어오도록 맞춰주세요.

<br>

촬영하면 자동으로 인식합니다.

</div>


</div>


<!-- =========================
     진행상태
========================= -->

<div class="card">


<div class="progress">


<div
    id="progressBar"
    class="progress-bar">
</div>


</div>


<div id="status">

사진을 첨부하거나 카메라로 촬영하세요.

</div>


</div>


<!-- =========================
     결과
========================= -->

<div class="card">


<h2>검사 결과</h2>


<div class="result">


<div class="result-box">


<div class="result-title">

GLOVIS Part No.

</div>


<div
    id="partResult"
    class="result-value">

-

</div>


</div>


<div class="result-box">


<div class="result-title">

GLOVIS Quantity

</div>


<div
    id="qtyResult"
    class="result-value">

-

</div>


</div>


</div>


</div>


<!-- =========================
     실제 OCR 영역
========================= -->

<div class="card">


<h2>실제 OCR 영역</h2>


<div class="preview-grid">


<div>

Part No.

<img id="partPreview">

</div>


<div>

Quantity

<img id="qtyPreview">

</div>


</div>


</div>


<!-- =========================
     OCR 원문
========================= -->

<div class="card">


<h2>OCR 원문</h2>


<pre id="rawResult">-</pre>


</div>


</div>



<script>


/* =====================================================
   기본 변수
===================================================== */

const video =
document.getElementById("video");


const photo =
document.getElementById("photo");


const fileInput =
document.getElementById("fileInput");


const cameraBtn =
document.getElementById("cameraBtn");


const captureBtn =
document.getElementById("captureBtn");


const progressBar =
document.getElementById("progressBar");


const statusEl =
document.getElementById("status");


const partResult =
document.getElementById("partResult");


const qtyResult =
document.getElementById("qtyResult");


const rawResult =
document.getElementById("rawResult");


const partPreview =
document.getElementById("partPreview");


const qtyPreview =
document.getElementById("qtyPreview");


let currentImage = null;

let cameraStream = null;



/* =====================================================
   상태 표시
===================================================== */

function setStatus(
    text,
    progress = null
) {

    statusEl.textContent =
        text;


    if(progress !== null) {

        progressBar.style.width =
            progress + "%";

    }

}



/* =====================================================
   이미지 로드
===================================================== */

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();


            img.onload =
                () => resolve(img);


            img.onerror =
                reject;


            img.src =
                src;

        }
    );

}



/* =====================================================
   이미지 설정
===================================================== */

function setImage(src) {

    currentImage =
        src;


    photo.src =
        src;


    photo.style.display =
        "block";


    video.style.display =
        "none";


    setStatus(
        "촬영 완료. 자동으로 인식합니다...",
        5
    );


    setTimeout(
        runFullOCR,
        150
    );

}



/* =====================================================
   사진 첨부
===================================================== */

fileInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];


        if(!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                setImage(
                    e.target.result
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);



/* =====================================================
   카메라 시작
===================================================== */

cameraBtn.addEventListener(
    "click",
    async function() {

        try {

            cameraStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },


                        width: {
                            ideal: 2560
                        },


                        height: {
                            ideal: 1440
                        }

                    },


                    audio: false

                });


            video.srcObject =
                cameraStream;


            await video.play();


            video.style.display =
                "block";


            photo.style.display =
                "none";


            captureBtn.disabled =
                false;


            setStatus(
                "노란 박스에 맞추고 촬영하세요."
            );

        }


        catch(error) {

            setStatus(
                "카메라 오류: " +
                error.message
            );

        }

    }
);



/* =====================================================
   촬영
===================================================== */

captureBtn.addEventListener(
    "click",
    function() {

        if(!video.videoWidth)
            return;


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(

            video,

            0,
            0,

            canvas.width,
            canvas.height

        );


        setImage(

            canvas.toDataURL(
                "image/jpeg",
                0.95
            )

        );


        if(cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


            cameraStream =
                null;

        }

    }
);



/* =====================================================
   이미지 자르기
===================================================== */

function cropImage(

    img,

    x,
    y,
    width,
    height

) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        Math.round(
            img.naturalWidth *
            width
        );


    canvas.height =
        Math.round(
            img.naturalHeight *
            height
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(

        img,

        Math.round(
            img.naturalWidth *
            x
        ),

        Math.round(
            img.naturalHeight *
            y
        ),

        Math.round(
            img.naturalWidth *
            width
        ),

        Math.round(
            img.naturalHeight *
            height
        ),

        0,
        0,

        canvas.width,
        canvas.height

    );


    return canvas;

}



/* =====================================================
   OCR 전처리
===================================================== */

function preprocess(
    sourceCanvas,
    mode
) {

    const scale = 5;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        sourceCanvas.width *
        scale;


    canvas.height =
        sourceCanvas.height *
        scale;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(

        sourceCanvas,

        0,
        0,

        canvas.width,
        canvas.height

    );


    const imageData =
        ctx.getImageData(

            0,
            0,

            canvas.width,
            canvas.height

        );


    const data =
        imageData.data;


    for(
        let i = 0;

        i < data.length;

        i += 4
    ) {

        let gray =

            0.299 * data[i] +

            0.587 * data[i + 1] +

            0.114 * data[i + 2];


        if(mode === "gray") {

            data[i] =
                gray;

            data[i + 1] =
                gray;

            data[i + 2] =
                gray;

        }


        if(mode === "contrast") {

            gray =
                (gray - 128)
                * 1.5
                + 128;


            gray =
                Math.max(
                    0,
                    Math.min(
                        255,
                        gray
                    )
                );


            data[i] =
                gray;

            data[i + 1] =
                gray;

            data[i + 2] =
                gray;

        }


        if(mode === "bw") {

            gray =
                gray > 175
                ? 255
                : 0;


            data[i] =
                gray;

            data[i + 1] =
                gray;

            data[i + 2] =
                gray;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}



/* =====================================================
   Part No. 정규화
===================================================== */

function normalizePart(text) {

    let s =

        (text || "")
        .toUpperCase()
        .replace(
            /[^0-9A-Z-]/g,
            ""
        );


    let match =

        s.match(
            /\d{5}-?[0-9A-Z]{5}/
        );


    if(!match) {

        match =
            s.match(
                /\d{10}/
            );

    }


    if(!match)
        return null;


    let part =
        match[0];


    part =
        part.replace(

            /^(\d{5})([0-9A-Z]{5})$/,

            "$1-$2"

        );


    /*
       OCR이

       23124-25120

       으로 읽는 경우

       S로 보정
    */

    part =
        part.replace(

            /^23124-25/,

            "23124-2S"

        );


    return part;

}



/* =====================================================
   Quantity 정규화
===================================================== */

function normalizeQuantity(text) {

    const matches =

        (text || "")
        .replace(
            /[^0-9]/g,
            " "
        )
        .match(
            /\d{1,5}/g
        );


    if(!matches)
        return null;


    matches.sort(
        (a,b) =>
            b.length - a.length
    );


    return matches[0];

}



/* =====================================================
   OCR 실행
===================================================== */

async function recognizeOne(
    canvas,
    type
) {

    const modes = [

        "gray",

        "contrast",

        "bw"

    ];


    const psmModes =

        type === "part"

        ? [7, 13, 8]

        : [7, 8];


    const results = [];


    for(
        const mode of modes
    ) {

        const processed =
            preprocess(
                canvas,
                mode
            );


        for(
            const psm of psmModes
        ) {

            const result =

                await Tesseract.recognize(

                    processed.toDataURL(
                        "image/png"
                    ),

                    "eng",

                    {

                        logger:
                        function(m) {

                            if(
                                m.status ===
                                "recognizing text"
                            ) {

                                setStatus(

                                    type +
                                    " 인식 중...",

                                    10 +
                                    (
                                        m.progress ||
                                        0
                                    ) * 70

                                );

                            }

                        },


                        tessedit_char_whitelist:

                            type === "part"

                            ?

                            "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-"

                            :

                            "0123456789",


                        load_system_dawg:
                            "0",


                        load_freq_dawg:
                            "0",


                        tessedit_pageseg_mode:
                            String(psm)

                    }

                );


            results.push(
                result.data.text ||
                ""
            );

        }

    }


    return results;

}



/* =====================================================
   전체 OCR
===================================================== */

async function runFullOCR() {

    if(!currentImage)
        return;


    try {

        setStatus(
            "식별표 위치를 분석하고 있습니다...",
            5
        );


        const img =
            await loadImage(
                currentImage
            );


        /* =================================================
           ★★★ 가장 중요한 부분 ★★★

           실제 사진의 숫자 위치를 기준으로
           Part No.와 Quantity만 잘라냄
        ================================================= */


        /*
           Part No.

           실제:
           23124-2S120

           x = 24%
           y = 49%

           width = 34%
           height = 7.5%
        */

        const partCanvas =

            cropImage(

                img,

                0.24,

                0.49,

                0.34,

                0.075

            );


        /*
           Quantity

           실제:
           240

           x = 81%
           y = 49%

           width = 10%
           height = 7.5%
        */

        const qtyCanvas =

            cropImage(

                img,

                0.81,

                0.49,

                0.10,

                0.075

            );


        /*
           실제 OCR 영역 화면에 표시
        */

        partPreview.src =

            partCanvas.toDataURL(
                "image/jpeg",
                0.95
            );


        qtyPreview.src =

            qtyCanvas.toDataURL(
                "image/jpeg",
                0.95
            );



        /* =================================================
           Part No. OCR
        ================================================= */

        setStatus(
            "Part No. 인식 중...",
            10
        );


        const partOCR =

            await recognizeOne(

                partCanvas,

                "part"

            );



        /* =================================================
           Quantity OCR
        ================================================= */

        setStatus(
            "Quantity 인식 중...",
            55
        );


        const qtyOCR =

            await recognizeOne(

                qtyCanvas,

                "qty"

            );



        /* =================================================
           Part 후보
        ================================================= */

        const candidates =

            partOCR

            .map(
                normalizePart
            )

            .filter(
                Boolean
            );


        const count = {};


        candidates.forEach(
            p => {

                count[p] =
                    (count[p] || 0) + 1;

            }
        );


        let part = null;


        const sortedParts =

            Object.keys(count)
            .sort(

                (a,b) =>
                    count[b] -
                    count[a]

            );


        if(
            sortedParts.length
        ) {

            part =
                sortedParts[0];

        }



        /* =================================================
           Quantity 후보
        ================================================= */

        const quantities =

            qtyOCR

            .map(
                normalizeQuantity
            )

            .filter(
                Boolean
            );


        const qtyCount = {};


        quantities.forEach(
            q => {

                qtyCount[q] =
                    (qtyCount[q] || 0) + 1;

            }
        );


        let qty = null;


        if(
            Object.keys(qtyCount)
            .length
        ) {

            qty =

                Object.keys(
                    qtyCount
                )
                .sort(

                    (a,b) =>
                        qtyCount[b] -
                        qtyCount[a]

                )[0];

        }



        /* =================================================
           결과 표시
        ================================================= */

        partResult.textContent =

            part ||
            "인식 실패";


        qtyResult.textContent =

            qty
            ? qty + " EA"
            : "인식 실패";


        partResult.className =

            "result-value " +

            (
                part
                ? "ok"
                : "fail"
            );


        qtyResult.className =

            "result-value " +

            (
                qty
                ? "ok"
                : "fail"
            );



        /* =================================================
           OCR 원문 표시
        ================================================= */

        rawResult.textContent =


            "===== Part No. OCR =====\n\n" +

            partOCR.join(
                "\n----------------\n"
            ) +


            "\n\n===== Quantity OCR =====\n\n" +

            qtyOCR.join(
                "\n----------------\n"
            ) +


            "\n\n===== Part 후보 =====\n\n" +

            JSON.stringify(
                candidates,
                null,
                2
            );


        setStatus(
            "인식 완료",
            100
        );

    }


    catch(error) {

        console.error(
            error
        );


        setStatus(
            "OCR 오류: " +
            error.message
        );


        rawResult.textContent =

            error.stack ||
            error.message;

    }

}

</script>

</body>

</html>
