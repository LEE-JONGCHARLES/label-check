<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMMA Label Check Simple v5.0</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f5f6f8}
.card{background:#fff;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
.btn-cam{width:100%;padding:14px;border:0;border-radius:8px;background:#0066ff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:8px}
input[type="file"]{display:none}
.result{padding:14px;border-radius:8px;margin-top:10px;font-size:18px;font-weight:bold}
.ok{background:#dff5e5;color:#08752b}.ng{background:#ffe2e2;color:#a40000}.wait{background:#eee}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:120px;overflow-y:auto;background:#fafafa;padding:8px;border:1px solid #ddd}
</style></head><body>

<h2>HMMA Label Check Simple v5.0</h2>

<div class="card">
  <b>① GLOVIS 식별표</b><br><br>
  <button class="btn-cam" onclick="document.getElementById('glovisFile').click()">📷 GLOVIS 사진 촬영</button>
  <input id="glovisFile" type="file" accept="image/*" capture="environment" onchange="readGlovis()">
  <div id="gResult" class="result wait">대기 중</div>
  <pre id="gRaw"></pre>
</div>

<div class="card">
  <b>② PNDT 식별표</b><br><br>
  <button class="btn-cam" onclick="document.getElementById('pndtFile').click()">📷 PNDT 사진 촬영</button>
  <input id="pndtFile" type="file" accept="image/*" capture="environment" onchange="readPndt()">
  <div id="pResult" class="result wait">대기 중</div>
  <pre id="pRaw"></pre>
</div>

<div class="card">
  <button class="btn-cam" style="background:#222;" onclick="compareLabels()">🔍 두 식별표 비교하기</button>
  <div id="finalResult" class="result wait">두 라벨을 먼저 인식하세요.</div>
</div>

<script>
let G = { part: "", qty: "" };
let P = { part: "", qty: "" };

// 세로 이미지 90도 자동 회전
function preprocessImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (img.height > img.width) {
        canvas.width = img.height;
        canvas.height = img.width;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((90 * Math.PI) / 180);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
      } else {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      }
      resolve(canvas.toDataURL('image/jpeg'));
    };
    img.src = URL.createObjectURL(file);
  });
}

// 1. GLOVIS: Part NO 및 QUANTITY 단순 추출
function parseGlovis(text) {
  let raw = (text || "").toUpperCase().replace(/\s+/g, ' ');
  let part = "", qty = "";

  // Part NO 근처 추출 (5자리-5자리 형태)
  let partMatch = raw.match(/\b([0-9]{5}[-][A-Z0-9]{5})\b/);
  if (!partMatch) partMatch = raw.match(/\b([0-9]{5}[A-Z0-9]{5})\b/);
  if (partMatch) part = partMatch[1];

  // Quantity 근처 숫자 추출
  let qtyMatch = raw.match(/(?:QUANTITY|QTY)[\s:：]*([0-9]{1,5})/i);
  if (!qtyMatch) qtyMatch = raw.match(/\b([0-9]{2,4})\b/); // 단순 2~4자리 숫자
  if (qtyMatch) qty = qtyMatch[1];

  return { part, qty };
}

// 2. PNDT: 부품번호 및 납품수량 (EA 앞 숫자) 단순 추출
function parsePndt(text) {
  let raw = (text || "").toUpperCase().replace(/\s+/g, ' ');
  let part = "", qty = "";

  // 부품번호 추출 (5자리-5자리 형태)
  let partMatch = raw.match(/\b([0-9]{5}[-][A-Z0-9]{5})\b/);
  if (!partMatch) partMatch = raw.match(/\b([0-9]{5}[A-Z0-9]{5})\b/);
  if (partMatch) part = partMatch[1];

  // 납품수량: 'EA' 바로 앞에 오는 숫자 최우선 추출
  let qtyMatch = raw.match(/([0-9]{1,5})\s*E\s*A/i);
  if (!qtyMatch) {
    qtyMatch = raw.match(/(?:납품수량|수량)[\s:：]*([0-9]{1,5})/i);
  }
  if (qtyMatch) qty = qtyMatch[1];

  return { part, qty };
}

async function ocr(file, lang) {
  const processedImg = await preprocessImage(file);
  const worker = await Tesseract.createWorker(lang);
  const ret = await worker.recognize(processedImg);
  await worker.terminate();
  return ret.data.text;
}

async function readGlovis() {
  let f = document.getElementById("glovisFile").files[0];
  if (!f) return;
  let resDiv = document.getElementById("gResult");
  resDiv.className = "result wait";
  resDiv.innerHTML = "GLOVIS 분석 중…";

  try {
    let raw = await ocr(f, "eng");
    document.getElementById("gRaw").textContent = raw;
    
    let res = parseGlovis(raw);
    G = res;
    
    resDiv.innerHTML = `Part NO: <b>${res.part || "미인식"}</b><br>QUANTITY: <b>${res.qty ? res.qty + " EA" : "미인식"}</b>`;
    resDiv.className = "result " + (res.part && res.qty ? "ok" : "ng");
  } catch (e) {
    resDiv.className = "result ng";
    resDiv.innerHTML = "GLOVIS 인식 실패";
  }
}

async function readPndt() {
  let f = document.getElementById("pndtFile").files[0];
  if (!f) return;
  let resDiv = document.getElementById("pResult");
  resDiv.className = "result wait";
  resDiv.innerHTML = "PNDT 분석 중…";

  try {
    let raw = await ocr(f, "kor+eng");
    document.getElementById("pRaw").textContent = raw;
    
    let res = parsePndt(raw);
    P = res;

    resDiv.innerHTML = `부품번호: <b>${res.part || "미인식"}</b><br>납품수량: <b>${res.qty ? res.qty + " EA" : "미인식"}</b>`;
    resDiv.className = "result " + (res.part && res.qty ? "ok" : "ng");
  } catch (e) {
    resDiv.className = "result ng";
    resDiv.innerHTML = "PNDT 인식 실패";
  }
}

// 3. 단순 비교 로직
function compareLabels() {
  let finalDiv = document.getElementById("finalResult");
  if (!G.part || !G.qty || !P.part || !P.qty) {
    finalDiv.className = "result ng";
    finalDiv.innerHTML = "🔴 CHECK<br>두 라벨을 먼저 모두 인식해주세요.";
    return;
  }

  // 하이픈(-) 제외 단순 숫자/문자 비교
  let cleanGPart = G.part.replace(/-/g, '');
  let cleanPPart = P.part.replace(/-/g, '');

  let partMatch = cleanGPart === cleanPPart;
  let qtyMatch = String(G.qty) === String(P.qty);

  if (partMatch && qtyMatch) {
    finalDiv.className = "result ok";
    finalDiv.innerHTML = "🟢 MATCH (일치)<br>부품번호 일치 / 수량 일치";
  } else {
    finalDiv.className = "result ng";
    finalDiv.innerHTML = `🔴 MISMATCH (불일치)<br>부품번호: ${partMatch ? "일치" : "불일치"}<br>수량: ${qtyMatch ? "일치" : "불일치"}`;
  }
}
</script>
</body>
</html>
