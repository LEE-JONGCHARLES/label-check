<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMMA Label Check v3.2</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f5f6f8}
.card{background:#fff;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
button{padding:12px 16px;border:0;border-radius:8px;background:#222;color:#fff;font-size:16px;margin:4px;cursor:pointer}
input{width:100%;margin:8px 0}.result{padding:14px;border-radius:8px;margin-top:10px;font-size:18px;font-weight:bold}
.ok{background:#dff5e5;color:#08752b}.ng{background:#ffe2e2;color:#a40000}.wait{background:#eee}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px}
.small{font-size:12px;color:#666}
</style></head><body>
<h1>HMMA Label Check v3.2</h1>

<div class="card"><b>① GLOVIS 식별표</b>
<input id="glovisFile" type="file" accept="image/*" capture="environment">
<button onclick="readGlovis()">GLOVIS 인식</button>
<div id="gResult" class="result wait">대기 중</div><pre id="gRaw"></pre></div>

<div class="card"><b>② PNDT 식별표</b>
<input id="pndtFile" type="file" accept="image/*" capture="environment">
<button onclick="readPndt()">PNDT 인식</button>
<div id="pResult" class="result wait">대기 중</div><pre id="pRaw"></pre></div>

<div class="card"><b>③ 최종 비교</b>
<button onclick="compareLabels()">두 라벨 비교</button>
<div id="finalResult" class="result wait">두 라벨을 먼저 인식하세요.</div></div>

<div class="card small">세로로 촬영된 라벨은 자동으로 회전시켜 인식률을 높입니다.</div>

<script>
let G={part:"",qty:""},P={part:"",qty:""};

// 이미지 자동 회전 보정 (세로 이미지 정방향 변환)
function preprocessImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (img.height > img.width) {
        canvas.width = img.height;
        canvas.height = img.width;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((90 * Math.PI) / 180);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
      } else {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      }
      resolve(canvas.toDataURL('image/jpeg'));
    };
    img.src = URL.createObjectURL(file);
  });
}

function norm(s){ return (s||"").toUpperCase().replace(/[–—−_]/g,"-").replace(/\s+/g," "); }

function sanitizePartCandidate(str) {
  return str.replace(/O/g, '0').replace(/I|L/g, '1').replace(/Z/g, '2').replace(/S/g, '5').replace(/B/g, '8');
}

function fixPart(s){
  let clean = sanitizePartCandidate(s);
  let m = clean.match(/(\d{5})[-]?([A-Z0-9]{5})/);
  if(!m) return "";
  let head = m[1], tail = m[2];
  if(/^2[5S]\d{3}$/.test(tail)) tail = "2S" + tail.slice(2);
  return head + "-" + tail;
}

function part(text){
  let t = norm(text);
  let sanitizedText = sanitizePartCandidate(t);
  let matches = sanitizedText.match(/\b\d{5}[-][A-Z0-9]{5}\b/g) || [];
  for(const z of matches){
    let p = fixPart(z);
    if(p) return p;
  }
  let noHyphenMatches = sanitizedText.match(/\b\d{5}[A-Z0-9]{5}\b/g) || [];
  for(const z of noHyphenMatches){
    let p = fixPart(z);
    if(p) return p;
  }
  return fixPart(sanitizedText);
}

function cleanQtyNum(str) {
  if(!str) return "";
  return str.replace(/O/gi, '0').replace(/I|L/gi, '1').replace(/[^0-9]/g, '');
}

function pndtQty(text){
  let raw = (text||"").replace(/\s+/g, " ");
  let idx = raw.search(/납품\s*수량|남품\s*수량|납\s*품|수\s*량/);
  if(idx >= 0){
    let target = raw.slice(idx, idx + 80);
    let m = target.match(/[:：\s]*([0-9OIlL]{1,7})\s*(E\s*A|EA)?/i);
    if(m) return cleanQtyNum(m[1]);
  }
  return genericQty(text);
}

function genericQty(text){
  let raw = (text||"").replace(/\s+/g, " ");
  // 1. GLOVIS 'Quantity 240' 키워드 기반 인식 (EA가 없는 경우 대응)
  let m = raw.match(/(?:QUANTITY|QTY|Q'TY)[\s:：]*([0-9OIlL]{1,7})/i);
  if(m) return cleanQtyNum(m[1]);

  // 2. 숫자 + EA 패턴
  m = raw.match(/([0-9OIlL]{1,7})\s*(E\s*A|EA)/i);
  if(m) return cleanQtyNum(m[1]);

  return "";
}

async function ocr(file, lang){
  const processedImg = await preprocessImage(file);
  const r = await Tesseract.recognize(processedImg, lang, { logger: x => console.log(x) });
  return r.data.text;
}

function box(id, msg, c){
  let e = document.getElementById(id);
  e.className = "result " + c;
  e.innerHTML = msg;
}

async function readGlovis(){
  let f = document.getElementById("glovisFile").files[0];
  if(!f) return alert("GLOVIS 사진을 선택하세요.");
  box("gResult", "인식 중…", "wait");
  try {
    let raw = await ocr(f, "eng");
    G = { part: part(raw), qty: genericQty(raw) };
    document.getElementById("gRaw").textContent = raw;
    box("gResult", "품번: <b>" + (G.part || "인식 실패") + "</b><br>수량: <b>" + (G.qty ? G.qty + " EA" : "인식 실패") + "</b>", G.part && G.qty ? "ok" : "ng");
  } catch(e) {
    box("gResult", "GLOVIS 인식 오류", "ng");
  }
}

async function readPndt(){
  let f = document.getElementById("pndtFile").files[0];
  if(!f) return alert("PNDT 사진을 선택하세요.");
  box("pResult", "인식 중…", "wait");
  try {
    let raw = await ocr(f, "kor+eng");
    P = { part: part(raw), qty: pndtQty(raw) };
    document.getElementById("pRaw").textContent = raw;
    box("pResult", "품번: <b>" + (P.part || "인식 실패") + "</b><br>납품수량: <b>" + (P.qty ? P.qty + " EA" : "인식 실패") + "</b>", P.part && P.qty ? "ok" : "ng");
  } catch(e) {
    box("pResult", "PNDT 인식 오류", "ng");
  }
}

function compareLabels(){
  if(!G.part || !G.qty || !P.part || !P.qty){
    box("finalResult", "🔴 CHECK<br>품번과 수량을 모두 인식해야 합니다.", "ng");
    return;
  }
  let a = G.part === P.part;
  let b = String(G.qty) === String(P.qty);
  box("finalResult", a && b ? "🟢 LABEL MATCH<br>품번 일치 / 수량 일치" : "🔴 LABEL MISMATCH<br>품번: " + (a ? "일치" : "불일치") + "<br>수량: " + (b ? "일치" : "불일치"), a && b ? "ok" : "ng");
}
</script></body></html>
